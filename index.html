<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script src="https://alwingulla.com/88/tag.min.js" data-zone="3573868" async data-cfasync="false"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#070913" />
  <title>NEON STACKER - Skill Arena</title>
  <style>
    :root {
      --bg: #070913;
      --panel: #101428;
      --neon-cyan: #00f3ff;
      --neon-pink: #ff0055;
      --neon-yellow: #f4ee2a;
      --neon-green: #00ff66;
      --text: #ffffff;
      --text-dim: #8b9bb4;
    }
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg); color: var(--text); overflow: hidden; width: 100vw; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    #game-container { position: relative; width: 100%; max-width: 480px; height: 100%; max-height: 850px; background: var(--panel); display: flex; flex-direction: column; box-shadow: 0 0 30px rgba(0,243,255,0.15); overflow: hidden; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: rgba(7,9,19,0.8); border-bottom: 1px solid rgba(0,243,255,0.2); z-index: 10; }
    .wallet-box { display: flex; gap: 10px; }
    .coin-badge { background: rgba(0,0,0,0.4); border: 1px solid var(--neon-cyan); border-radius: 20px; padding: 4px 10px; font-size: 13px; font-weight: bold; color: var(--neon-cyan); display: flex; align-items: center; gap: 5px; }
    .coin-badge.tickets { border-color: var(--neon-yellow); color: var(--neon-yellow); }
    canvas { flex: 1; display: block; background: radial-gradient(circle at center, #101428 0%, #070913 100%); }
    .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(7,9,19,0.92); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; z-index: 20; transition: opacity 0.2s ease; }
    .screen.hidden { opacity: 0; pointer-events: none; }
    h1 { font-size: 32px; color: var(--neon-cyan); text-shadow: 0 0 10px rgba(0,243,255,0.5); margin-bottom: 8px; text-align: center; font-weight: 900; letter-spacing: 2px; }
    p.subtitle { color: var(--text-dim); font-size: 14px; margin-bottom: 24px; text-align: center; }
    .btn { background: linear-gradient(135deg, var(--neon-cyan), #0088ff); color: #000; border: none; padding: 14px 28px; font-size: 16px; font-weight: bold; border-radius: 30px; cursor: pointer; text-transform: uppercase; box-shadow: 0 0 15px rgba(0,243,255,0.4); margin: 8px 0; width: 80%; max-width: 260px; transition: transform 0.1s, box-shadow 0.1s; }
    .btn:active { transform: scale(0.96); }
    .btn.pink { background: linear-gradient(135deg, var(--neon-pink), #ff00aa); color: #fff; box-shadow: 0 0 15px rgba(255,0,85,0.4); }
    .btn.yellow { background: linear-gradient(135deg, var(--neon-yellow), #ffaa00); color: #000; box-shadow: 0 0 15px rgba(244,238,42,0.4); }
    .btn.secondary { background: transparent; border: 2px solid var(--text-dim); color: var(--text-dim); box-shadow: none; }
    .hud-overlay { position: absolute; top: 60px; left: 0; width: 100%; padding: 0 20px; display: flex; justify-content: space-between; pointer-events: none; z-index: 5; }
    .stat-display { font-size: 24px; font-weight: 900; color: #fff; text-shadow: 0 0 8px rgba(0,0,0,0.8); }
    #toast { position: absolute; top: 80px; left: 50%; transform: translateX(-50%) translateY(-20px); background: rgba(0,243,255,0.9); color: #000; padding: 8px 16px; border-radius: 20px; font-weight: bold; font-size: 13px; opacity: 0; transition: all 0.3s; z-index: 100; pointer-events: none; text-align: center; box-shadow: 0 0 15px rgba(0,243,255,0.6); }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <div id="game-container">
    <header>
      <div class="wallet-box">
        <div class="coin-badge tickets">🎫 <span id="val-tickets">50</span></div>
        <div class="coin-badge">🪙 <span id="val-cash">2.00</span></div>
      </div>
      <button class="btn secondary" style="padding:4px 10px; font-size:11px; width:auto; margin:0;" onclick="openDashboard()">Owner Dashboard</button>
    </header>

    <div class="hud-overlay">
      <div class="stat-display" id="hud-score">0</div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <!-- MAIN MENU -->
    <div id="screen-menu" class="screen">
      <h1>NEON STACKER</h1>
      <p class="subtitle">Stack blocks with precision. Win real rewards.</p>
      <button class="btn" onclick="startGame()">Play Game</button>
      <button class="btn pink" onclick="triggerRewardedAd()">Watch Ad (+10 🎫)</button>
    </div>

    <!-- GAME OVER -->
    <div id="screen-gameover" class="screen hidden">
      <h1>GAME OVER</h1>
      <p class="subtitle" id="go-score-text">Score: 0</p>
      <button class="btn" onclick="startGame()">Play Again</button>
      <button class="btn pink" onclick="triggerRewardedAd()">Watch Ad (+10 🎫)</button>
      <button class="btn secondary" onclick="returnToMenu()">Main Menu</button>
    </div>

    <!-- OWNER DASHBOARD -->
    <div id="screen-dashboard" class="screen hidden">
      <h1>OWNER STATS</h1>
      <p class="subtitle">Live Revenue Simulator</p>
      <div style="background: rgba(255,255,255,0.05); padding: 15px; border-radius: 12px; width: 100%; max-width: 280px; margin-bottom: 20px; border: 1px solid rgba(0,243,255,0.2);">
        <p style="font-size: 13px; color: var(--text-dim);">Est. Ad Revenue:</p>
        <p style="font-size: 22px; color: var(--neon-green); font-weight: bold; margin-bottom: 10px;" id="dash-ad-rev">$0.0000</p>
        <p style="font-size: 13px; color: var(--text-dim);">Ads Watched Today:</p>
        <p style="font-size: 18px; color: var(--neon-cyan); font-weight: bold;" id="dash-ads-count">0 / 15</p>
      </div>
      <button class="btn secondary" onclick="closeDashboard()">Back to Game</button>
    </div>

    <div id="toast">Notification</div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let state = {
      tickets: 50,
      cash: 2.00,
      adsWatched: 0,
      ownerAdRev: 0.0000
    };

    let gameState = "MENU"; // MENU, PLAYING, GAMEOVER
    let score = 0;
    let tower = [];
    let currentBlock = null;
    let cameraY = 0;
    const BLOCK_HEIGHT = 30;
    const INITIAL_WIDTH = 160;

    function resizeCanvas() {
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function loadState() {
      const saved = localStorage.getItem('neon_stacker_state');
      if (saved) { try { state = JSON.parse(saved); } catch(e){} }
      updateUI();
    }

    function saveState() {
      localStorage.setItem('neon_stacker_state', JSON.stringify(state));
      updateUI();
    }

    function updateUI() {
      document.getElementById('val-tickets').innerText = state.tickets;
      document.getElementById('val-cash').innerText = state.cash.toFixed(2);
      document.getElementById('dash-ad-rev').innerText = "$" + state.ownerAdRev.toFixed(4);
      document.getElementById('dash-ads-count').innerText = state.adsWatched + " / 15";
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }

    function startGame() {
      document.getElementById('screen-menu').classList.add('hidden');
      document.getElementById('screen-gameover').classList.add('hidden');
      document.getElementById('screen-dashboard').classList.add('hidden');
      
      score = 0;
      tower = [];
      cameraY = 0;
      document.getElementById('hud-score').innerText = score;

      // Base block
      tower.push({
        x: canvas.width / 2 - INITIAL_WIDTH / 2,
        y: canvas.height - 120,
        w: INITIAL_WIDTH,
        color: '#00f3ff'
      });

      spawnBlock();
      gameState = "PLAYING";
    }

    function spawnBlock() {
      const last = tower[tower.length - 1];
      const colors = ['#00f3ff', '#ff0055', '#f4ee2a', '#00ff66'];
      const color = colors[tower.length % colors.length];
      
      currentBlock = {
        x: 0,
        y: last.y - BLOCK_HEIGHT,
        w: last.w,
        vx: 3.5 + (tower.length * 0.1),
        color: color,
        dir: 1
      };
    }

    canvas.addEventListener('pointerdown', () => {
      if (gameState !== "PLAYING") return;
      sliceBlock();
    });

    function sliceBlock() {
      const last = tower[tower.length - 1];
      const diff = currentBlock.x - last.x;

      if (Math.abs(diff) >= last.w) {
        // Missed completely
        gameState = "GAMEOVER";
        document.getElementById('go-score-text').innerText = "Score: " + score;
        document.getElementById('screen-gameover').classList.remove('hidden');
        return;
      }

      // Successful placement / slicing
      const overlap = last.w - Math.abs(diff);
      currentBlock.w = overlap;
      if (diff > 0) {
        currentBlock.x = last.x + diff;
      } else {
        currentBlock.x = last.x;
      }

      tower.push(currentBlock);
      score++;
      document.getElementById('hud-score').innerText = score;

      // Shift camera upwards as tower grows
      if (tower.length > 6) {
        cameraY += BLOCK_HEIGHT;
      }

      spawnBlock();
    }

    function loop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.save();
      ctx.translate(0, cameraY);

      // Draw tower
      for (let i = 0; i < tower.length; i++) {
        let b = tower[i];
        ctx.fillStyle = b.color;
        ctx.shadowColor = b.color;
        ctx.shadowBlur = 10;
        ctx.fillRect(b.x, b.y, b.w, BLOCK_HEIGHT - 2);
      }

      // Move and draw active block
      if (gameState === "PLAYING" && currentBlock) {
        currentBlock.x += currentBlock.vx * currentBlock.dir;
        if (currentBlock.x <= 0 || currentBlock.x + currentBlock.w >= canvas.width) {
          currentBlock.dir *= -1;
        }

        ctx.fillStyle = currentBlock.color;
        ctx.shadowColor = currentBlock.color;
        ctx.shadowBlur = 15;
        ctx.fillRect(currentBlock.x, currentBlock.y, currentBlock.w, BLOCK_HEIGHT - 2);
      }

      ctx.restore();
      requestAnimationFrame(loop);
    }

    // MONETAG AD INTEGRATION (Zone ID: 3573868)
    function triggerRewardedAd() {
      if (state.adsWatched >= 15) {
        showToast("Umefikisha limit ya matangazo kwa leo (15/15)!");
        return;
      }

      const prev = gameState;
      if (gameState === "PLAYING") gameState = "PAUSED";

      const monetagFn = window["show_3573868"];

      if (typeof monetagFn === "function") {
        monetagFn().then(() => {
          state.tickets += 10;
          state.adsWatched += 1;
          state.ownerAdRev += 0.0025;
          addLog("AD VIEWED: +10 Tickets credited via Monetag");
          showToast("+10 Tickets zimeingia kwenye wallet yako!");
          gameState = prev === "PLAYING" ? "PLAYING" : "MENU";
          saveState();
        }).catch(() => {
          showToast("Tangazo halipatikani kwa sasa. Jaribu tena baadae!");
          gameState = prev === "PLAYING" ? "PLAYING" : "MENU";
        });
        return;
      }

      // Simulator fallback kama script haijajipakia bado
      setTimeout(() => {
        state.tickets += 10;
        state.adsWatched += 1;
        state.ownerAdRev += 0.0025;
        showToast("+10 Tickets zimeingia (Demo Mode)!");
        saveState();
        gameState = prev === "PLAYING" ? "PLAYING" : "MENU";
      }, 1000);
    }

    function addLog(text) {
      console.log(text);
    }

    function openDashboard() {
      document.getElementById('screen-menu').classList.add('hidden');
      document.getElementById('screen-gameover').classList.add('hidden');
      document.getElementById('screen-dashboard').classList.remove('hidden');
    }

    function closeDashboard() {
      document.getElementById('screen-dashboard').classList.add('hidden');
      document.getElementById('screen-menu').classList.remove('hidden');
    }

    function returnToMenu() {
      document.getElementById('screen-gameover').classList.add('hidden');
      document.getElementById('screen-menu').classList.remove('hidden');
    }

    loadState();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
