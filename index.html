
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEON ARCADE</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:linear-gradient(135deg,#fff0f7,#e6faff,#f0eaff);color:#25194d}
header{padding:18px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.logo{font-size:25px;font-weight:900;color:#7948e8}
.wallet{background:white;padding:12px 18px;border-radius:30px;font-weight:bold}
.hero{margin:10px 15px;padding:35px 25px;border-radius:25px;background:linear-gradient(120deg,#6843e9,#ed5caa);color:white}
.hero h1{font-size:clamp(32px,7vw,55px);margin:10px 0}
.hero p{line-height:1.6}
button{border:0;cursor:pointer;font-weight:bold}
.play{background:#ffe45c;color:#38256d;padding:13px 23px;border-radius:30px}
h2{margin:25px 18px 15px}
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:13px;padding:0 15px 30px}
.game{background:white;border-radius:18px;overflow:hidden;text-align:left;color:#25194d;box-shadow:0 5px 18px #38236b15}
.art{height:110px;display:grid;place-items:center;font-size:52px;background:linear-gradient(135deg,var(--a),var(--b))}
.info{padding:12px}.info p{font-size:12px;color:#777}
.modal{display:none;position:fixed;inset:0;background:#17102ddd;z-index:5;align-items:center;justify-content:center;padding:12px}
.modal.show{display:flex}
.panel{background:white;width:min(700px,100%);padding:17px;border-radius:22px}
.panelhead{display:flex;justify-content:space-between;align-items:center}
.close{font-size:25px;background:#eee8ff;border-radius:50%;width:38px;height:38px}
canvas{width:100%;background:linear-gradient(140deg,#211951,#5140a0);border-radius:15px;touch-action:none}
.controls{display:flex;gap:8px;justify-content:center;margin:12px;flex-wrap:wrap}
.controls button{background:#754be8;color:white;padding:12px 18px;border-radius:25px}
#message{text-align:center;color:#6b5a9c;font-size:13px}
footer{text-align:center;padding:20px;color:#777}
</style>
</head>
<body>
<header>
<div class="logo">⚡ NEON ARCADE</div>
<div class="wallet">🎟️ <span id="tickets">0</span> Tickets</div>
</header>

<section class="hero">
<small>WELCOME TO THE PLAY ZONE</small>
<h1>PLAY BEYOND LIMITS!</h1>
<p>10 exciting games. Challenge yourself, beat your records and have fun!</p>
<button class="play" onclick="document.getElementById('games').scrollIntoView({behavior:'smooth'})">PLAY NOW 🎮</button>
</section>

<h2>🔥 CHOOSE YOUR GAME</h2>
<div class="toolbar">
<input id="gameSearch"
type="search"
placeholder="🔎 Search your favourite game...">
</div>

<div class="games" id="games"></div>
<footer>NEON ARCADE · PLAY · ENJOY · REPEAT</footer>

<div class="modal" id="modal">
<div class="panel">
<div class="panelhead">
<h2 id="title">Game</h2>
<button class="close" onclick="closeGame()">×</button>
</div>
<p>Score: <b id="score">0</b> | Best: <b id="best">0</b></p>
<canvas id="canvas" width="600" height="380"></canvas>
<div class="controls">
<button onclick="startGame()">START / RESTART</button>
<button onclick="move(-1)">◀ LEFT</button>
<button onclick="move(1)">RIGHT ▶</button>
</div>
<p id="message">Press START to play!</p>
</div>
</div>

<script>
const games=[
["Neon Stacker","🧱","Timing","#36d9ff","#6252ed"],
["Neon Runner","🏃","Action","#ff75a8","#ffb45e"],
["Neon Dodger","☄️","Survival","#8675ff","#43d8ff"],
["Bubble Pop","🫧","Arcade","#5ce1d4","#598cff"],
["Memory Match","🧠","Puzzle","#ff9ed1","#a77bff"],
["Neon Snake","🐍","Classic","#a1ed65","#22c9a0"],
["Neon Pong","🏓","Sport","#ffcf58","#ff7b65"],
["Brick Breaker","💥","Arcade","#ff8d62","#e95da8"],
["Flappy Star","⭐","Skill","#f9dc62","#ff9b55"],
["Whack-a-Mole","🐹","Quick","#78d9ff","#8d73ed"]
];

let tickets=Number(localStorage.getItem("neon_tickets")||0);
let best=Number(localStorage.getItem("neon_best")||0);
let id=0,score=0,playing=false,raf=0,state={},last=0;
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
const $=x=>document.getElementById(x);

function wallet(){
$("tickets").textContent=tickets;
$("best").textContent=best;
}
function renderGames(query=""){
 const q=query.toLowerCase().trim();

 const filtered=games
 .map((g,i)=>({g,i}))
 .filter(x=>
  x.g[0].toLowerCase().includes(q) ||
  x.g[2].toLowerCase().includes(q)
 );

 $("games").innerHTML=filtered.length
 ?filtered.map(({g,i})=>`
  <button class="game" onclick="openGame(${i})">
   <div class="art"
   style="--a:${g[3]};--b:${g[4]}">
   ${g[1]}
   </div>
   <div class="info">
    <strong>${g[0]}</strong>
    <p>${g[2].toUpperCase()} GAME · PLAY NOW</p>
   </div>
  </button>
 `).join("")
 :`<div class="no-results">No games found. Try another name.</div>`;
}

renderGames();

$("gameSearch").addEventListener("input",e=>{
 renderGames(e.target.value);
});

function openGame(n){
id=n;
$("title").textContent=games[n][0];
$("modal").classList.add("show");
drawIntro();
}
function closeGame(){
playing=false;
cancelAnimationFrame(raf);
$("modal").classList.remove("show");
}
function drawIntro(){
ctx.clearRect(0,0,600,380);
ctx.textAlign="center";
ctx.fillStyle="white";
ctx.font="70px Arial";
ctx.fillText(games[id][1],300,170);
ctx.font="22px Arial";
ctx.fillText("PRESS START TO PLAY",300,230);
}
function startGame(){
cancelAnimationFrame(raf);
playing=true;score=0;last=0;state={};
$("score").textContent=0;
$("message").textContent="Game started!";

if(id===0)state={x:0,w:200,blocks:[{x:200,y:320,w:200}],y:280,v:4};
if(id===1)state={y:300,vy:0,obstacles:[],t:0};
if(id===2)state={x:300,meteors:[],t:0};
if(id===3)state={bubbles:[],t:0,time:30};
if(id===4)state={cards:["🍓","🍋","🍇","🍉","🍒","🥝","🍓","🍋","🍇","🍉","🍒","🥝"].sort(()=>Math.random()-.5),open:[],done:[],moves:0};
if(id===5)state={snake:[{x:10,y:7},{x:9,y:7},{x:8,y:7}],dx:1,dy:0,food:{x:15,y:7},t:0};
if(id===6)state={x:300,y:190,vx:4,vy:3,p:150};
if(id===7){
state={x:300,y:280,vx:3,vy:-4,p:250,bricks:[]};
for(let r=0;r<4;r++)for(let c=0;c<8;c++)state.bricks.push({x:30+c*68,y:40+r*25,on:true});
}
if(id===8)state={y:180,vy:0,gates:[],t:0};
if(id===9)state={hole:4,t:0,until:0};
raf=requestAnimationFrame(loop);
}
function add(n=1){
score+=n;
$("score").textContent=score;
}
function end(){
if(!playing)return;
playing=false;
cancelAnimationFrame(raf);
tickets+=Math.max(1,Math.floor(score/5));
best=Math.max(best,score);
localStorage.setItem("neon_tickets",tickets);
localStorage.setItem("neon_best",best);
wallet();
$("message").textContent="Game over! Tickets earned. Play again!";
}
function bg(){
ctx.clearRect(0,0,600,380);
ctx.fillStyle="#ffffff18";
for(let x=15;x<600;x+=35)
for(let y=15;y<380;y+=35)ctx.fillRect(x,y,2,2);
}
function box(x,y,w,h,c){
ctx.fillStyle=c;ctx.fillRect(x,y,w,h);
}
function ball(x,y,r,c){
ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
}
function label(t,x,y){
ctx.fillStyle="white";ctx.font="bold 20px Arial";ctx.fillText(t,x,y);
}
function loop(t){
if(!playing)return;
let dt=Math.min((t-last)/16.67||1,2);
last=t;bg();
let s=state;

switch(id){
case 0:{
let base=s.blocks[s.blocks.length-1];
s.x+=s.v*dt;
if(s.x<0||s.x+s.w>600)s.v*=-1;
s.blocks.forEach(b=>box(b.x,b.y,b.w,25,"#38dfff"));
box(s.x,s.y,s.w,25,"#ffe45c");
label("TAP TO STACK",220,35);
break;
}
case 1:{
s.t+=dt;
if(s.t>60){s.t=0;s.obstacles.push({x:620,y:300})}
s.vy+=.6*dt;s.y+=s.vy*dt;
if(s.y>300)s.y=300,s.vy=0;
box(70,s.y,30,45,"#ff64ad");
s.obstacles.forEach(o=>{
o.x-=5*dt;box(o.x,o.y,30,45,"#ffe45c");
if(o.x<100&&o.x>65)end();
if(!o.p&&o.x<60)o.p=1,add();
});
s.obstacles=s.obstacles.filter(o=>o.x>-40);
break;
}
case 2:{
s.t+=dt;
if(s.t>24){s.t=0;s.meteors.push({x:Math.random()*580,y:-15})}
ball(s.x,335,15,"#49e5ff");
s.meteors.forEach(m=>{
m.y+=4*dt;ball(m.x,m.y,12,"#ff6aa9");
if(Math.hypot(m.x-s.x,m.y-335)<24)end();
if(!m.p&&m.y>390)m.p=1,add();
});
s.meteors=s.meteors.filter(m=>m.y<400);
break;
}
case 3:{
s.t+=dt;s.time-=dt/60;
if(s.t>12){s.t=0;s.bubbles.push({x:20+Math.random()*560,y:360,r:12+Math.random()*15})}
s.bubbles.forEach(b=>{b.y-=2*dt;ball(b.x,b.y,b.r,"#58dfff")});
s.bubbles=s.bubbles.filter(b=>b.y>0);
label("TIME "+Math.ceil(s.time),20,30);
if(s.time<=0)end();
break;
}
case 4:{
label("MATCH THE PAIRS",210,28);
s.cards.forEach((v,i)=>{
let x=85+(i%4)*110,y=50+Math.floor(i/4)*105;
box(x,y,85,75,s.done.includes(i)?"#26b99b":s.open.includes(i)?"#8b67ed":"#53438d");
ctx.fillStyle="white";ctx.font="30px Arial";ctx.textAlign="center";
ctx.fillText(s.done.includes(i)||s.open.includes(i)?v:"?",x+42,y+48);
});
if(s.done.length===12)end();
break;
}
case 5:{
s.t+=dt;
if(s.t>8){
s.t=0;
let h={x:s.snake[0].x+s.dx,y:s.snake[0].y+s.dy};
if(h.x<0||h.x>=20||h.y<0||h.y>=12||s.snake.some(a=>a.x===h.x&&a.y===h.y)){end();break}
s.snake.unshift(h);
if(h.x===s.food.x&&h.y===s.food.y){
add(5);s.food={x:Math.floor(Math.random()*20),y:Math.floor(Math.random()*12)};
}else s.snake.pop();
}
s.snake.forEach((a,i)=>box(a.x*30,10+a.y*30,25,25,i?"#36dcae":"#e0ff63"));
ball(12+s.food.x*30,22+s.food.y*30,8,"#ff639f");
break;
}
case 6:{
s.x+=s.vx*dt;s.y+=s.vy*dt;
if(s.x<10||s.x>590)s.vx*=-1;
if(s.y<10||s.y>370)s.vy*=-1;
box(20,s.p,12,80,"#ff68ad");
ball(s.x,s.y,10,"#ffe45c");
if(s.x<40&&s.y>s.p-5&&s.y<s.p+85){s.vx=Math.abs(s.vx);add()}
if(s.x<0)end();
if(s.x>590){s.vx=-Math.abs(s.vx);add()}
break;
}
case 7:{
s.x+=s.vx*dt;s.y+=s.vy*dt;
if(s.x<10||s.x>590)s.vx*=-1;
if(s.y<10)s.vy=Math.abs(s.vy);
box(s.p,355,100,12,"#42e3ff");
ball(s.x,s.y,9,"#ffe45c");
if(s.y>340&&s.x>s.p&&s.x<s.p+100)s.vy=-Math.abs(s.vy);
s.bricks.forEach(b=>{
if(b.on){
box(b.x,b.y,58,16,"#ff68ad");
if(s.x>b.x&&s.x<b.x+58&&s.y>b.y&&s.y<b.y+16){
b.on=false;s.vy*=-1;add();
}
}
});
if(s.y>390)end();
if(s.bricks.every(b=>!b.on))end();
break;
}
case 8:{
s.t+=dt;s.vy+=.35*dt;s.y+=s.vy*dt;
if(s.t>90){
s.t=0;let top=50+Math.random()*160;
s.gates.push({x:620,top,bottom:top+130});
}
ball(120,s.y,14,"#ffe45c");
s.gates.forEach(g=>{
g.x-=3*dt;
box(g.x,0,35,g.top,"#50dcb7");
box(g.x,g.bottom,35,380-g.bottom,"#50dcb7");
if(g.x<135&&g.x>85&&(s.y<g.top||s.y>g.bottom))end();
if(!g.p&&g.x<85)g.p=1,add();
});
if(s.y<0||s.y>380)end();
break;
}
case 9:{
s.t++;
if(s.t>s.until){s.hole=Math.floor(Math.random()*9);s.until=s.t+40}
for(let i=0;i<9;i++){
let x=120+(i%3)*180,y=90+Math.floor(i/3)*100;
ball(x,y,30,"#6b4b9d");
if(i===s.hole){
ball(x,y-5,21,"#c18a52");
ball(x-8,y-10,4,"white");
ball(x+8,y-10,4,"white");
}
}
label("TAP THE MOLE",210,30);
if(s.t>1500)end();
break;
}
}
if(playing)raf=requestAnimationFrame(loop);
}

function move(dir){
if(!playing)return;
let s=state;
if(id===0){
let base=s.blocks[s.blocks.length-1];
let left=Math.max(s.x,base.x);
let right=Math.min(s.x+s.w,base.x+base.w);
if(right<=left){end();return}
let w=right-left;
s.blocks.push({x:left,y:base.y-30,w});
s.w=w;s.y=base.y-60;s.x=0;s.v=4+score*.12;
add();
}
if(id===1&&s.y>=300)s.vy=-12;
if(id===2)s.x=Math.max(15,Math.min(585,s.x+dir*35));
if(id===3){
let b=s.bubbles.pop();
if(b)add();
}
if(id===6)s.p=Math.max(0,Math.min(300,s.p+dir*35));
if(id===7)s.p=Math.max(0,Math.min(500,s.p+dir*35));
if(id===8)s.vy=-7;
}

canvas.addEventListener("pointerdown",e=>{
if(!playing)return;
let r=canvas.getBoundingClientRect();
let x=(e.clientX-r.left)*600/r.width;
let y=(e.clientY-r.top)*380/r.height;
let s=state;
if(id===0)move(1);
if(id===1&&s.y>=300)s.vy=-12;
if(id===2)s.x=x;
if(id===3){
for(let i=s.bubbles.length-1;i>=0;i--){
let b=s.bubbles[i];
if(Math.hypot(x-b.x,y-b.y)<b.r+12){s.bubbles.splice(i,1);add();break}
}
}
if(id===4){
for(let i=0;i<12;i++){
let cx=85+(i%4)*110,cy=50+Math.floor(i/4)*105;
if(x>cx&&x<cx+85&&y>cy&&y<cy+75&&!s.done.includes(i)&&!s.open.includes(i)){
s.open.push(i);
if(s.open.length===2){
s.moves++;
if(s.cards[s.open[0]]===s.cards[s.open[1]]){
s.done.push(...s.open);add(2);
s.open=[];
}else setTimeout(()=>{s.open=[]},700);
}
break;
}
}
}
if(id===5){
let dx=x-300;
if(Math.abs(dx)>20){
if(dx>0&&s.dx!==-1)s.dx=1,s.dy=0;
if(dx<0&&s.dx!==1)s.dx=-1,s.dy=0;
}
}
if(id===6)s.p=y-40;
if(id===7)s.p=x-50;
if(id===8)s.vy=-7;
if(id===9){
let i=s.hole;
let cx=120+(i%3)*180,cy=90+Math.floor(i/3)*100;
if(Math.hypot(x-cx,y-cy)<35){add(2);s.hole=-1;s.until=s.t+5}
}
});

window.addEventListener("keydown",e=>{
if(!playing)return;
if(e.key==="ArrowLeft")move(-1);
if(e.key==="ArrowRight")move(1);
if(e.key===" "){
if(id===1&&state.y>=300)state.vy=-12;
if(id===8)state.vy=-7;
}
if(id===5){
if(e.key==="ArrowUp"&&state.dy!==1)state.dx=0,state.dy=-1;
if(e.key==="ArrowDown"&&state.dy!==-1)state.dx=0,state.dy=1;
if(e.key==="ArrowLeft"&&state.dx!==1)state.dx=-1,state.dy=0;
if(e.key==="ArrowRight"&&state.dx!==-1)state.dx=1,state.dy=0;
}
});

wallet();
</script>
</body>
</html>
